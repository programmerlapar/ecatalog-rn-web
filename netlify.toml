[build]
  command = "yarn install --frozen-lockfile && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.15.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
